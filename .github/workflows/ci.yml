name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified immutable checkout v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # verified immutable setup-python v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m compileall -q current
      - run: pytest -q
      - name: Verify wheel includes MIT license
        run: |
          python -m pip wheel --no-deps --wheel-dir current-dist .
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("current-dist").glob("goreecloud_current-*.whl"))
          assert len(wheels) == 1, "Expected one GoreeCloud Current wheel"
          with ZipFile(wheels[0]) as package:
              names = package.namelist()
              licenses = [name for name in names if name.endswith("/licenses/LICENSE")]
              assert len(licenses) == 1, "Wheel must bundle one MIT LICENSE"
              assert b"Copyright (c) 2026 GoreeCloud" in package.read(licenses[0])
              metadata = next(name for name in names if name.endswith(".dist-info/METADATA"))
              assert "License-Expression: MIT" in package.read(metadata).decode("utf-8")
          PY
