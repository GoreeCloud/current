[project]
name = "goreecloud-current"
version = "0.1.0"
description = "Privacy-conscious RSS and weather backend for GoreeCloud"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "defusedxml>=0.7,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["current*"]
